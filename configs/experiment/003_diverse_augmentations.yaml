# @package _global_
name: 003_diverse_augmentations

data:
  train_augmentations:
    - _target_: albumentations.HorizontalFlip
      p: 0.5
    - _target_: albumentations.Affine
      scale: [0.85, 1.15]
      keep_ratio: true
      translate_percent: [-0.05, 0.05]
      rotate: [-15, 15]
      mask_interpolation: 0  # cv2.INTER_NEAREST
      fill: 0
      fill_mask: 0
      p: 0.6
    # Choose one lighting or color change; child probabilities are equal weights.
    - _target_: albumentations.OneOf
      p: 0.6
      transforms:
        - _target_: albumentations.RandomBrightnessContrast
          brightness_limit: 0.2
          contrast_limit: 0.2
          p: 1.0
        - _target_: albumentations.HueSaturationValue
          hue_shift_limit: 8
          sat_shift_limit: 15
          val_shift_limit: 10
          p: 1.0
        - _target_: albumentations.RGBShift
          r_shift_limit: 10
          g_shift_limit: 10
          b_shift_limit: 10
          p: 1.0
        - _target_: albumentations.RandomGamma
          gamma_limit: [80, 120]
          p: 1.0
        - _target_: albumentations.CLAHE
          clip_limit: [1.0, 2.0]
          tile_grid_size: [8, 8]
          p: 1.0
    # Occasionally simulate mild image quality degradation.
    - _target_: albumentations.OneOf
      p: 0.25
      transforms:
        - _target_: albumentations.GaussianBlur
          blur_limit: [3, 5]
          sigma_limit: [0.3, 1.0]
          p: 1.0
        - _target_: albumentations.GaussNoise
          std_range: [0.01, 0.04]
          mean_range: [0.0, 0.0]
          p: 1.0
        - _target_: albumentations.ImageCompression
          quality_range: [70, 95]
          compression_type: jpeg
          p: 1.0
    - _target_: albumentations.ToGray
      num_output_channels: 3
      p: 0.1
