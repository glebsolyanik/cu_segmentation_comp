defaults:
  - _self_
  - experiment: ???

name: ???
seed: 42
checkpoint_dir: ${hydra:runtime.output_dir}/checkpoints

data:
  root: data
  image_size: [256, 256]
  batch_size: 64
  train_workers: 8
  valid_workers: 4
  pin_memory: true

model:
  _target_: src.models.BasicUnet
  in_channels: 3
  num_classes: 1
  base_channels: 32

loss:
  _target_: torch.nn.BCEWithLogitsLoss

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1e-4

scheduler: null

logger:
  _target_: lightning.pytorch.loggers.CometLogger
  project: cv_logs
  name: ${name}

trainer:
  max_epochs: 30
  accelerator: gpu
  precision: 16-mixed
  log_every_n_steps: 1
  accumulate_grad_batches: 1
  default_root_dir: ${hydra:runtime.output_dir}
