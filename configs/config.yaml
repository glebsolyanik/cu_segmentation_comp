defaults:
  - model: basic_unet
  - _self_
  - experiment: ???

name: ???
seed: 42
checkpoint_dir: ${hydra:runtime.output_dir}/checkpoints

data:
  root: data/train/data
  image_size: [256, 256]
  batch_size: 64
  train_workers: 8
  valid_workers: 4
  pin_memory: true
  train_augmentations: []

loss:
  _target_: torch.nn.BCEWithLogitsLoss

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1e-4

scheduler: null

# Score every experiment against the same 256x256 validation targets.
evaluation:
  image_size: [256, 256]

logger:
  _target_: lightning.pytorch.loggers.TensorBoardLogger
  save_dir: ${hydra:runtime.output_dir}
  name: ${name}
  version: ""

trainer:
  max_epochs: 30
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 1
  accumulate_grad_batches: 1
  default_root_dir: ${hydra:runtime.output_dir}
