[project]
name = "week-6"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "albumentations>=2.0.8",
    "comet-ml>=3.58.8",
    "hydra-core>=1.3.7",
    "lightning>=2.6.6",
    "python-dotenv>=1.2.4",
    "torch==2.6.0",
    "torchmetrics>=1.9.0",
    "tqdm>=4.70.1",
]

[tool.uv]
required-version = ">=0.13.6"
preview-features = ["minimum-libc-version"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
minimum-libc-version = { glibc = "2.17" }
# Require prebuilt numerical libraries rather than compiling them on the cluster.
no-build-package = ["numpy", "scipy"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
