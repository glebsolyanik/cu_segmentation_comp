[project]
name = "week-6"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "albumentations>=2.0.8",
    "comet-ml>=3.58.8",
    "hydra-core>=1.3.7",
    "lightning>=2.6.6",
    "python-dotenv>=1.2.4",
    "tensorboard>=2.21.0",
    "torch==2.6.0",
    "torchmetrics>=1.9.0",
    "tqdm>=4.70.1",
]

[tool.uv]
required-version = ">=0.13.6"
preview-features = ["minimum-libc-version"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
minimum-libc-version = { glibc = "2.17" }

# Select ready-made wheels compatible with the cluster instead of compiling C extensions.
no-build-package = ["numpy", "scipy", "pillow"]

[tool.uv.sources]
# Use the reachable host directly; the CUDA index links to download-r2.pytorch.org.
# This wheel targets the cluster's Python 3.12 on Linux x86_64.
torch = [
    { url = "https://download.pytorch.org/whl/cu124/torch-2.6.0%2Bcu124-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
]
